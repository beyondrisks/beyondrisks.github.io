# The Model Advantage — site configuration
# No remote theme: this repo ships its own layouts/_includes/assets.

# Site Settings
locale: "en-US"
title: "The Model Advantage"
name: "The Model Advantage"
tagline: "Data Science & AI Consulting"
description: "The Model Advantage is a data science and AI consulting firm. We develop and validate statistical and machine learning models, build AI agents and automations, and deliver custom software for data-driven businesses."
url: "https://www.themodeladvantage.com"
baseurl: ""
repository: "beyondrisks/beyondrisks.github.io"
email: "contact@themodeladvantage.com"
logo: "/assets/images/model_advantage_slice.png"
google_analytics: G-FPN3XBMRHL

# Author / organization
author:
  name: "The Model Advantage, LLC"
  location: "United States"
  email: "contact@themodeladvantage.com"

# GSA contract (shown on Clients page and footer)
gsa:
  contract_number: "47QRAA26D009T"
  elibrary_url: "https://www.gsaelibrary.gsa.gov/ElibMain/contractorInfo.do?contractNumber=47QRAA26D009T&contractorName=THE+MODEL+ADVANTAGE%2C+LLC&executeQuery=YES"

# Reading Files
include:
  - _pages

# Outputting
permalink: /blogs/:title/
timezone: "America/New_York"

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

whitelist:
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

# Archives (liquid, GitHub Pages compatible)
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# Markdown
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author_profile: false
      read_time: false
      share: false
      related: false
  - scope:
      path: ""
      type: pages
    values:
      layout: page

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development
